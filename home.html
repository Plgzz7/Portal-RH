    <script>
        // Saudação dinâmica conforme o horário do dia + nome do usuário logado
        const hour = new Date().getHours();
        let saudacao = 'Boa noite';
        if (hour >= 5 && hour < 12) saudacao = 'Bom dia';
        else if (hour >= 12 && hour < 18) saudacao = 'Boa tarde';
        const userName = localStorage.getItem('empireads-user-name') || 'Visitante';
        document.getElementById('greeting-title').textContent = saudacao + ', ' + userName.split(' ')[0];
        const avatarEl = document.querySelector('.topbar-actions .avatar');
        if (avatarEl) avatarEl.textContent = userName.trim()[0].toUpperCase();
        
        // Mostra aba admin se for administrador (depois que tudo carregou)
        setTimeout(() => {
            if (typeof isAdmin === 'function' && isAdmin()) {
                const navAdmin = document.getElementById('nav-admin');
                if (navAdmin) navAdmin.style.display = 'flex';
            }
        }, 100);
    </script>

    <script>
        // ===== CONEXÃO COM GOOGLE AGENDA =====
        // Para ativar: crie um projeto no Google Cloud Console, ative a "Google Calendar API",
        // crie uma credencial OAuth 2.0 (Aplicativo da Web) com a origem do portal autorizada
        // (ex.: http://localhost:8000) e cole o Client ID abaixo.
        const GOOGLE_CLIENT_ID = '518825832032-p5cscbq5cem9t31pv45j6n2gla375fn6.apps.googleusercontent.com';
        const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/calendar.readonly';

        let googleTokenClient = null;
        let googleAccessToken = null;

        const googleBtn = document.getElementById('google-connect-btn');
        const meetingsBox = document.getElementById('google-meetings');
        const rangeBox = document.getElementById('google-range');
        let googleRange = 'today'; // 'today' | 'week'

        googleBtn.addEventListener('click', () => {
            if (googleAccessToken) return; // já conectado
            if (GOOGLE_CLIENT_ID.startsWith('SEU_')) {
                meetingsBox.innerHTML = '<p class="meetings-status">Configure o GOOGLE_CLIENT_ID no código para ativar a conexão com o Google.</p>';
                return;
            }
            if (typeof google === 'undefined' || !google.accounts) {
                meetingsBox.innerHTML = '<p class="meetings-status">Serviço do Google ainda carregando… tente novamente.</p>';
                return;
            }
            if (!googleTokenClient) {
                googleTokenClient = google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: GOOGLE_SCOPES,
                    callback: async (resp) => {
                        if (resp.error) {
                            meetingsBox.innerHTML = '<p class="meetings-status">Conexão cancelada ou negada.</p>';
                            return;
                        }
                        googleAccessToken = resp.access_token;
                        googleBtn.classList.add('connected');
                        googleBtn.querySelector('span').textContent = 'Google conectado ✓';
                        // Ao conectar, esconde os eventos fixos e mostra apenas a agenda real do usuário
                        const staticEvents = document.getElementById('static-events');
                        if (staticEvents) staticEvents.style.display = 'none';
                        rangeBox.style.display = 'flex';
                        await carregarReunioes();
                    },
                });
            }
            // 'select_account' garante que o Google sempre mostre o seletor
            // de contas, permitindo que cada usuário autorize com a própria conta
            googleTokenClient.requestAccessToken({ prompt: 'select_account' });
        });

        // Alternância entre "Hoje" e "Próximos 7 dias"
        rangeBox.querySelectorAll('.range-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (btn.dataset.range === googleRange) return;
                googleRange = btn.dataset.range;
                rangeBox.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b === btn));
                await carregarReunioes();
            });
        });

        async function carregarReunioes() {
            meetingsBox.innerHTML = '<p class="meetings-status">Carregando reuniões…</p>';
            const agora = new Date();
            const inicio = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate()).toISOString();
            const dias = googleRange === 'week' ? 7 : 1;
            const fim = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate() + dias).toISOString();
            try {
                const url = 'https://www.googleapis.com/calendar/v3/calendars/primary/events'
                    + '?timeMin=' + encodeURIComponent(inicio)
                    + '&timeMax=' + encodeURIComponent(fim)
                    + '&singleEvents=true&orderBy=startTime';
                const res = await fetch(url, { headers: { Authorization: 'Bearer ' + googleAccessToken } });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                renderizarReunioes(data.items || []);
            } catch (err) {
                meetingsBox.innerHTML = '<p class="meetings-status">Não foi possível carregar as reuniões.</p>';
            }
        }

        function escapeHtml(texto) {
            return String(texto).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function renderizarReunioes(eventos) {
            if (!eventos.length) {
                const msgVazio = googleRange === 'week'
                    ? 'Nenhuma reunião ou evento marcado nos próximos 7 dias.'
                    : 'Nenhuma reunião ou evento marcado para hoje.';
                meetingsBox.innerHTML = '<p class="meetings-status meetings-empty">📅 ' + msgVazio + '</p>';
                return;
            }
            const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
            const itens = eventos.map((ev, idx) => {
                const ini = ev.start.dateTime ? new Date(ev.start.dateTime) : null;
                const fim = ev.end.dateTime ? new Date(ev.end.dateTime) : null;
                const ref = ini || new Date();
                const horario = ini
                    ? ini.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + ' – ' + fim.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })
                    : 'Dia inteiro';
                const local = ev.location ? '<br>' + escapeHtml(ev.location) : '';
                const rotuloData = ref.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });

                // ===== Detalhes da reunião =====
                const meetLink = ev.hangoutLink
                    || (ev.conferenceData && ev.conferenceData.entryPoints
                        && (ev.conferenceData.entryPoints.find(e => e.entryPointType === 'video') || {}).uri)
                    || '';
                let detalhes = '';
                if (ev.description) detalhes += '<p class="meeting-desc">' + escapeHtml(ev.description) + '</p>';
                detalhes += '<p class="meeting-meta">Organizador: ' + escapeHtml((ev.organizer && ev.organizer.email) || '—') + '</p>';
                if (ev.attendees && ev.attendees.length) {
                    detalhes += '<p class="meeting-meta">Participantes: ' + ev.attendees.map(a => escapeHtml(a.email)).join(', ') + '</p>';
                }
                if (meetLink) {
                    detalhes += '<a class="meeting-link" href="' + escapeHtml(meetLink) + '" target="_blank" rel="noopener">'
                        + '<svg viewBox="0 0 24 24"><path d="m22 8-6 4 6 4V8Z"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>'
                        + 'Entrar na reunião</a>';
                }

                return '<div class="event-item meeting-item" data-meeting="' + idx + '">'
                    + '<div class="event-date"><span class="month">' + meses[ref.getMonth()] + '</span><span class="day">' + ref.getDate() + '</span></div>'
                    + '<div class="meeting-body"><h4>' + escapeHtml(ev.summary || '(Sem título)') + '</h4>'
                    + '<p>' + rotuloData + ' &nbsp;·&nbsp; ' + horario + local + '</p>'
                    + '<div class="meeting-details" id="meeting-details-' + idx + '">' + detalhes + '</div>'
                    + '</div>'
                    + '</div>';
            }).join('');
            const tituloLista = googleRange === 'week'
                ? 'Suas reuniões dos próximos 7 dias · Google Agenda'
                : 'Suas reuniões de hoje · Google Agenda';
            meetingsBox.innerHTML = '<h4 class="meetings-title">' + tituloLista + '</h4>' + itens;

            // Clique na reunião: abre/fecha o painel de detalhes
            meetingsBox.querySelectorAll('.meeting-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('a')) return; // não fecha ao clicar no link do Meet
                    item.classList.toggle('expanded');
                });
            });
        }
    </script>
